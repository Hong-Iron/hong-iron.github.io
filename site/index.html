<style>
/* Layout: one centred column — name, one line, then two large link cards */
:root { --bg: #f6f4ef; --card: #ffffff; --line: #ddd7cc; --fg: #1d1b18; --muted: #6b665d; --hot: #e2571d; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1115; --card: #171a21; --line: #2a2f3a; --fg: #eef0f4; --muted: #9aa2ae; --hot: #ff7a3d; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0f1115; --card: #171a21; --line: #2a2f3a; --fg: #eef0f4; --muted: #9aa2ae; --hot: #ff7a3d; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 400 16px/1.6 "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
main { width: min(720px, 100% - 32px); padding: 48px 0; display: grid; gap: 28px; }
h1 { margin: 0; font-size: clamp(36px, 7vw, 56px); letter-spacing: -.02em; line-height: 1.05; }
.lede { margin: -16px 0 0; color: var(--muted); }
.links { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.links a { display: grid; gap: 6px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
.links a:hover { border-color: var(--hot); transform: translateY(-2px); }
.links a:focus-visible { outline: 2px solid var(--hot); outline-offset: 3px; }
.links strong { font-size: 20px; }
.links span { color: var(--muted); font-size: 14.5px; }
.links em { margin-top: 6px; font-style: normal; color: var(--hot); font-weight: 600; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .links a { transition: none; } .links a:hover { transform: none; } }
</style>
</head>
<body>
<main>
  <h1>Hong-Iron</h1>

    <a href="/Hongs_Blog/"><strong>Hong-Iron 블로그</strong><span>프로젝트, 지식 DB, 나의 팡세를 한곳에 모은 블로그.</span><em>블로그 보기 →</em></a>
  </nav>
</main>
</body>
</html>
